<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Note Taker</title>
    <meta name="description" content="Write, edit and organize notes, saved to an Express API." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/styles.css" />
  </head>
  <body class="landing">
    <main class="hero">
      <span class="logo-mark" aria-hidden="true">✎</span>
      <h1>Note Taker</h1>
      <p>Capture ideas, to-dos and meeting notes in one clean place. Your notes are saved to the server, so they're there when you come back.</p>
      <a class="btn btn-lg" href="/notes">Open my notes</a>
      <ul class="features">
        <li>Create, edit and delete notes</li>
        <li>Search by title or text</li>
        <li>Keyboard shortcut: Ctrl/⌘ + S to save</li>
      </ul>
    </main>
  </body>
</html>
