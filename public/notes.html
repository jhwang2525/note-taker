<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Notes | Note Taker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/styles.css" />
  </head>
  <body class="app">
    <aside class="sidebar">
      <div class="sidebar-head">
        <a class="brand" href="/"><span class="logo-mark sm" aria-hidden="true">✎</span> Note Taker</a>
        <button type="button" class="icon-btn new-note" title="New note" aria-label="New note">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
        </button>
      </div>
      <label class="sr-only" for="search">Search notes</label>
      <input id="search" class="search" type="search" placeholder="Search notes…" />
      <ul class="note-list" aria-label="Saved notes"></ul>
    </aside>

    <main class="editor">
      <div class="editor-bar">
        <p class="status" id="status" aria-live="polite"></p>
        <div class="editor-actions">
          <button type="button" class="btn btn-ghost delete-note" hidden>Delete</button>
          <button type="button" class="btn save-note" disabled>Save note</button>
        </div>
      </div>
      <label class="sr-only" for="note-title">Note title</label>
      <input id="note-title" class="note-title" placeholder="Note title" maxlength="60" type="text" />
      <label class="sr-only" for="note-text">Note text</label>
      <textarea id="note-text" class="note-textarea" placeholder="Start writing…"></textarea>
    </main>

    <script src="/assets/js/index.js"></script>
  </body>
</html>
